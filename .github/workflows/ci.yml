name: adapter-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.14.0", "23.6.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
      # All packaging checks run on Windows too; only the existing POSIX signal
      # suite and live-child stdout EOF case remain skipped inside vitest.
      - name: Verify reproducible builds and tarball installation
        run: node scripts/verify-package.mjs
